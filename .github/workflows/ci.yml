name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-gi \
            gir1.2-adw-1 \
            libgtk-4-1 \
            libadwaita-1-0 \
            desktop-file-utils \
            appstream \
            cppcheck

      - name: Check shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Version files agree
        # meson.build, the rpm spec, the Debian changelog, the metainfo, the
        # CHANGELOG and the README carry the version by hand; v1.0.1 shipped
        # .deb files called 1.0.0 because one of them was forgotten.
        run: scripts/check-version.sh

      - name: The bump script still writes all six
        # On a copy of the tree, with a stand-in Unreleased entry when the
        # CHANGELOG has none (right after a release): the six files must
        # agree afterwards and dpkg must read the new Debian version.
        run: |
          set -euo pipefail
          cp -a . "$RUNNER_TEMP/bump" && cd "$RUNNER_TEMP/bump"
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk '/^## \[/ && !done { print "## [Unreleased]\n\n### Fixed\n- Stand-in entry for the CI self-test.\n"; done = 1 } { print }' \
              CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          fi
          scripts/bump-version.sh 99.0.0 --date 2030-01-01
          dpkg-parsechangelog -l packaging/debian/debian/changelog -S Version | grep -qx '99.0.0-1'
          grep -q '^\* Tue Jan 01 2030 .* - 99.0.0-1$' packaging/rpm/wayland-scroll-factor.spec
          grep -q '<release version="99.0.0" date="2030-01-01">' data/io.github.danielgrasso.WaylandScrollFactor.metainfo.xml
          appstreamcli validate --no-net data/io.github.danielgrasso.WaylandScrollFactor.metainfo.xml
          ! scripts/bump-version.sh 99.0.0 --date 2030-01-01 2>/dev/null
          sed -i 's/Current release: 99.0.0\./Current release: 98.0.0./' README.md
          ! scripts/check-version.sh 99.0.0 >/dev/null 2>&1

      - name: Static analysis (cppcheck)
        run: |
          # -DWSF_LIBDIR / -DWSF_VERSION mirror meson's compile-time
          # defines (passed to the tools target). Without them cppcheck
          # explores the consuming branches with each macro auto-assumed
          # as int 1, producing bogus `%s requires char*` warnings on the
          # snprintf/printf that consume them. The values are irrelevant
          # to the analysis; they only have to be the string literals the
          # real build uses.
          cppcheck --enable=warning,performance,portability \
            --inline-suppr --error-exitcode=2 --quiet -I src \
            -DWSF_LIBDIR='"/usr/lib/wayland-scroll-factor"' \
            -DWSF_VERSION='"0.0.0"' \
            src/ tools/wsf.c

      - name: Build (warnings are errors)
        run: |
          meson setup build --prefix=/usr --buildtype=release --werror
          meson compile -C build

      - name: Validate installed metadata inputs
        run: |
          python3 -m py_compile gui/wsf_gui.py
          desktop-file-validate build/data/io.github.danielgrasso.WaylandScrollFactor.desktop
          # Default builds must ship NO Hyprland artifacts (opt-in module).
          test ! -e build/data/wayland-scroll-factor-hyprland.desktop
          appstreamcli validate --no-net data/io.github.danielgrasso.WaylandScrollFactor.metainfo.xml

      - name: Build + validate the Hyprland opt-in module
        # The module is unsupported but must keep compiling; its session
        # desktop is only generated in a -Dhyprland=enabled build.
        run: |
          meson setup build-hypr --prefix=/usr --buildtype=release --werror -Dhyprland=enabled
          meson compile -C build-hypr
          grep '^Exec=' build-hypr/data/wayland-scroll-factor-hyprland.desktop
          grep '^DesktopNames=Hyprland' build-hypr/data/wayland-scroll-factor-hyprland.desktop

      - name: Exercise CLI config I/O
        run: |
          mkdir -p "$RUNNER_TEMP/wsf-home"
          HOME="$RUNNER_TEMP/wsf-home" ./build/tools/wsf set 0.35
          HOME="$RUNNER_TEMP/wsf-home" ./build/tools/wsf get --json | grep 'scroll_vertical_factor'
          HOME="$RUNNER_TEMP/wsf-home" ./build/tools/wsf status --json | grep '"config"'

  distro-smoke:
    name: Distro smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: source

    strategy:
      fail-fast: false
      matrix:
        target:
          - fedora
          - ubuntu
          - debian
          - arch
          - opensuse

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run container smoke test
        run: CONTAINER_ENGINE=docker scripts/test-containers.sh "${{ matrix.target }}"
